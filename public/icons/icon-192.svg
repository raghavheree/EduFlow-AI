<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="192" height="192" rx="42" fill="url(#grad1)" />
  
  <!-- Graduation Cap / Diamond Base -->
  <g transform="translate(96, 78)">
    <polygon points="0,-36 62,-2 0,32 -62,-2" fill="#FFFFFF" fill-opacity="0.95" />
    <path d="M-38,18 L-38,46 C-38,62 38,62 38,46 L38,18 C28,26 -28,26 -38,18 Z" fill="#FFFFFF" fill-opacity="0.85" />
    <!-- Tassel -->
    <path d="M52,6 L52,42" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="52" cy="46" r="4" fill="#93C5FD" />
    <!-- Center AI Node -->
    <circle cx="0" cy="-2" r="7" fill="#2563EB" />
    <circle cx="0" cy="-2" r="3" fill="#FFFFFF" />
  </g>
  
  <!-- AI Sparkle / Flow Nodes -->
  <circle cx="96" cy="148" r="4" fill="#93C5FD" opacity="0.9" />
  <circle cx="76" cy="154" r="3" fill="#BFDBFE" opacity="0.7" />
  <circle cx="116" cy="154" r="3" fill="#BFDBFE" opacity="0.7" />
  <line x1="76" y1="154" x2="96" y2="148" stroke="#93C5FD" stroke-width="2" opacity="0.5" />
  <line x1="116" y1="154" x2="96" y2="148" stroke="#93C5FD" stroke-width="2" opacity="0.5" />
</svg>
